name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "release/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish the .geode file into the repo (release folder)
        uses: actions/checkout@v4
        with:
          path: repo

      - run: |
          mkdir -p repo/release
          find "${{ steps.build.outputs.build-output }}" -name "*.geode" -exec cp {} repo/release/ \;
          ls -la repo/release
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release
          git commit -m "Add built mod [skip ci]" || exit 0
          git push
